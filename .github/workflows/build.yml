name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 缓存 debug keystore：签名跨构建保持一致
    - name: Cache debug keystore (stable signing)
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: android-debug-keystore-v1

    # 显式保证 keystore 存在（构建前生成/复用，签名从此稳定）
    - name: Ensure debug keystore exists
      run: |
        mkdir -p ~/.android
        if [ ! -f ~/.android/debug.keystore ]; then
          keytool -genkeypair \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          echo "debug keystore generated"
        else
          echo "debug keystore restored from cache"
        fi

    # 固定 Gradle 8.9（AGP 8.7 官方兼容版本，与可正常安装的 uma-juece-ramen 同思路）
    - name: Setup Gradle (pinned 8.9)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.9

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Build Release APK (signed with debug keystore)
      run: gradle assembleRelease --no-daemon

    # 诊断：签名证书 + 包信息 + 启动入口 + 图标，全部打进构建日志
    - name: Verify APK signature & badging
      run: |
        BT=$(ls -d ${ANDROID_HOME}/build-tools/*/ | sort | tail -1)
        echo "===== DEBUG APK ====="
        ls -la app/build/outputs/apk/debug/
        ${BT}apksigner verify --print-certs app/build/outputs/apk/debug/football-*.apk || echo "apksigner verify failed"
        ${BT}aapt2 dump badging app/build/outputs/apk/debug/football-*.apk | grep -E "package:|launchable-activity|application-icon|sdkVersion|targetSdkVersion" || true
        echo "===== RELEASE APK ====="
        ls -la app/build/outputs/apk/release/
        ${BT}apksigner verify --print-certs app/build/outputs/apk/release/football-*.apk || echo "apksigner verify failed"
        ${BT}aapt2 dump badging app/build/outputs/apk/release/football-*.apk | grep -E "package:|launchable-activity|application-icon|sdkVersion|targetSdkVersion" || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: apk-files
        path: app/build/outputs/apk/*/football-*.apk

    # 发布到 GitHub Releases：手机直接下载 .apk 文件（文件名带版本号，认准最新版）
    - name: Publish APKs to GitHub Release (direct .apk download)
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        TAG=latest-apk
        gh release delete $TAG --yes --cleanup-tag || true
        gh release create $TAG \
          --title "足球游戏 安装包 v1.0.4 (build ${{ github.run_number }})" \
          --notes "全新包名版本：下载 football-1.0.4-release.apk 直接安装（无需解压）。已签名、含崩溃报告。" \
          app/build/outputs/apk/release/football-1.0.4-release.apk \
          app/build/outputs/apk/debug/football-1.0.4-debug.apk
