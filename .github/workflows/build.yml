name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 缓存 debug keystore：签名跨构建保持一致，
    # 否则每次 CI 都生成新签名 → 新 APK 与手机上已装版本签名冲突，覆盖安装必失败
    - name: Cache debug keystore (stable signing)
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: android-debug-keystore-v1

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Build Release APK (signed with debug keystore)
      run: gradle assembleRelease

    # 诊断：把两个 APK 的签名证书与包信息（minSdk/版本/权限）打印进构建日志，
    # 手机装不上时对着日志就能看出是签名、minSdk 还是清单问题
    - name: Verify APK signature & badging
      run: |
        BT=$(ls -d ${ANDROID_HOME}/build-tools/*/ | sort | tail -1)
        echo "===== DEBUG APK ====="
        ls -la app/build/outputs/apk/debug/
        ${BT}apksigner verify --print-certs --verbose app/build/outputs/apk/debug/app-debug.apk || echo "apksigner verify failed"
        ${BT}aapt2 dump badging app/build/outputs/apk/debug/app-debug.apk | head -25 || true
        echo "===== RELEASE APK ====="
        ls -la app/build/outputs/apk/release/
        ${BT}apksigner verify --print-certs --verbose app/build/outputs/apk/release/*.apk || echo "apksigner verify failed"
        ${BT}aapt2 dump badging app/build/outputs/apk/release/*.apk | head -25 || true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk
